<!DOCTYPE html>
<html lang="cs" data-lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}YAMAN SOUND</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="author" content="YAMAN SOUND">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} — {% endif %}YAMAN SOUND">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ page.image | default: '/assets/img/yaman-og.webp' | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#000000">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/png" href="{{ '/assets/img/favicon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=51">
  <script defer src="{{ '/assets/js/lang.js' | relative_url }}?v=50"></script>
</head>
<body>
  {% include header.html %}
  {{ content }}
  {% include footer.html %}
</body>
</html>
