backend:
  name: github
  repo: xxlopa/yaman-sound.eu
  branch: main
  # GitHub Pages needs an OAuth proxy for secure login.
  # After OAuth is ready, add for example:
  # base_url: https://YOUR-OAUTH-PROXY-DOMAIN

media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

locale: "cs"
display_url: "https://yaman-sound.eu"
logo_url: "/assets/img/yaman-recordings-logo.webp"

collections:
  - name: "content_files"
    label: "YAMAN Content"
    files:
      - file: "content/sound.json"
        name: "sound"
        label: "Sound"
        fields:
          - label: "Sound posts"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Visible", name: "visible", widget: "boolean", default: true }
              - { label: "Order", name: "order", widget: "number", default: 10, value_type: "int", hint: "Lower number = first." }
              - { label: "Label", name: "label", widget: "string", required: false, hint: "Example: NEW RELEASE" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Link", name: "url", widget: "string", required: false }
              - { label: "Czech short text", name: "text_cs", widget: "string", required: false }
              - { label: "English short text", name: "text_en", widget: "string", required: false }
      - file: "content/events.json"
        name: "events"
        label: "Events"
        fields:
          - label: "Event posts"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Visible", name: "visible", widget: "boolean", default: true }
              - { label: "Order", name: "order", widget: "number", default: 10, value_type: "int", hint: "Lower number = first." }
              - { label: "Featured", name: "featured", widget: "boolean", default: false, required: false }
              - { label: "Venue / label", name: "label", widget: "string", required: false }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "string", required: false }
              - { label: "Location", name: "location", widget: "string", required: false }
              - { label: "Image / flyer", name: "image", widget: "image" }
              - { label: "Link", name: "url", widget: "string", required: false }
              - { label: "Czech short text", name: "text_cs", widget: "string", required: false }
              - { label: "English short text", name: "text_en", widget: "string", required: false }
      - file: "content/media.json"
        name: "media"
        label: "Media"
        fields:
          - label: "Media posts"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Visible", name: "visible", widget: "boolean", default: true }
              - { label: "Order", name: "order", widget: "number", default: 10, value_type: "int", hint: "Lower number = first." }
              - { label: "Label", name: "label", widget: "string", default: "Videoset", required: false }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "YouTube video ID", name: "youtube_id", widget: "string", required: false, hint: "Only the ID, e.g. Kpx5cHtHu-k" }
              - { label: "Image", name: "image", widget: "image", required: false, hint: "Used when there is no YouTube ID." }
              - { label: "Link", name: "url", widget: "string", required: false }
              - { label: "Czech short text", name: "text_cs", widget: "string", required: false }
              - { label: "English short text", name: "text_en", widget: "string", required: false }
