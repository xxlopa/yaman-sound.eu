# YAMAN SOUND — Pages CMS configuration
# English-only CMS
# Sound / Releases includes rich-text descriptions and streaming platform links.

media:
- name: images
  label: Images
  input: assets/uploads
  output: /assets/uploads
  categories:
  - image
  rename: safe

content:

# =========================================================
# EVENTS
# =========================================================

- name: events
  label: Events
  type: collection
  path: _events
  filename: '{primary}.md'

  view:
    fields:
    - title
    - event_date
    - status
    - featured
    - published

    primary: title

    sort:
    - event_date
    - title

    search:
    - title
    - venue

    default:
      sort: event_date
      order: desc

  fields:
  - name: title
    label: Event title
    type: string
    required: true

  - name: event_date
    label: Date
    type: date
    required: true
    options:
      format: yyyy-MM-dd

  - name: date_display
    label: Date shown on site
    type: string
    description: 'Example: 03. 10. 2026'
    required: true

  - name: venue
    label: Venue
    type: string
    required: true

  - name: city
    label: City
    type: string
    default: Prague

  - name: address
    label: Address
    type: string

  - name: image
    label: Flyer
    type: image
    required: true
    options:
      media: images
      path: events
      rename: safe

  - name: status
    label: Status
    type: select
    required: true
    default: upcoming
    options:
      values:
      - name: upcoming
        label: Upcoming
      - name: past
        label: Past

  - name: featured
    label: Show on homepage
    type: boolean
    default: false

  - name: published
    label: Published
    type: boolean
    default: true

  - name: summary_en
    label: Card text
    type: text
    required: true

  - name: description_en
    label: Detail description
    type: rich-text
    required: true
    options:
      format: markdown
      media: false

  - name: extra_info_en
    label: Extra info
    type: text

  - name: ticket_url
    label: GoOut / tickets URL
    type: string

  - name: ticket_label
    label: Ticket button label
    type: string
    default: Tickets / GoOut

  - name: facebook
    label: Facebook event URL
    type: string

  - name: instagram
    label: Instagram post URL
    type: string

  - name: lineup_headliners
    label: Headliners
    type: string
    list: true

  - name: lineup_supporting
    label: Supporting lineup
    type: string
    list: true


# =========================================================
# CREW
# =========================================================

- name: crew
  label: Crew
  type: collection
  path: _crew
  filename: '{primary}.md'

  view:
    fields:
    - title
    - role
    - order
    - published

    primary: title

    sort:
    - order
    - title

    search:
    - title
    - role

    default:
      sort: order
      order: asc

  fields:
  - name: title
    label: Artist name
    type: string
    required: true

  - name: order
    label: Position/order
    type: number
    required: true

  - name: role
    label: Role
    type: string
    required: true

  - name: image
    label: Photo
    type: image
    required: true
    options:
      media: images
      path: crew
      rename: safe

  - name: published
    label: Published
    type: boolean
    default: true

  - name: preview_en
    label: Card text
    type: text
    required: true

  - name: bio_en
    label: Bio
    type: rich-text
    required: true
    options:
      format: markdown
      media: false

  - name: instagram
    label: Instagram URL
    type: string

  - name: facebook
    label: Facebook URL
    type: string

  - name: soundcloud
    label: SoundCloud URL
    type: string

  - name: youtube
    label: YouTube URL
    type: string


# =========================================================
# SOUND / RELEASES
# =========================================================

- name: sound_posts
  label: Sound / Releases
  type: collection
  path: _sound_posts
  filename: '{primary}.md'

  view:
    fields:
    - title
    - role
    - order
    - featured
    - published

    primary: title

    sort:
    - order
    - title

    search:
    - title
    - role

    default:
      sort: order
      order: asc

  fields:
  - name: title
    label: Title
    type: string
    required: true

  - name: order
    label: Position/order
    type: number
    required: true

  - name: role
    label: Label above title
    type: string
    default: NEW RELEASE

  - name: image
    label: Cover / image
    type: image
    required: true
    options:
      media: images
      path: sound
      rename: safe

  - name: published
    label: Published
    type: boolean
    default: true

  - name: featured
    label: Show on homepage
    type: boolean
    default: false

  - name: summary_en
    label: Card text
    type: text
    required: true

  - name: description_en
    label: Release description
    type: rich-text
    required: true
    options:
      format: markdown
      media: false

  - name: smartlink_url
    label: All platforms / Smartlink URL
    type: string
    description: Optional master link to all streaming platforms.

  - name: soundcloud_url
    label: SoundCloud URL
    type: string

  - name: free_download_url
    label: Free Download URL
    type: string
    description: Copy the FREE DOWNLOAD link from the SoundCloud track/release description. Leave empty if unavailable.

  - name: spotify_url
    label: Spotify URL
    type: string

  - name: apple_music_url
    label: Apple Music URL
    type: string

  - name: youtube_url
    label: YouTube URL
    type: string

  - name: deezer_url
    label: Deezer URL
    type: string

  - name: tidal_url
    label: TIDAL URL
    type: string

  - name: amazon_music_url
    label: Amazon Music URL
    type: string

  - name: beatport_url
    label: Beatport URL
    type: string

  - name: bandcamp_url
    label: Bandcamp URL
    type: string


# =========================================================
# MEDIA / VIDEOSETS
# =========================================================

- name: media_posts
  label: Media / Videosets
  type: collection
  path: _media_posts
  filename: '{primary}.md'

  view:
    fields:
    - title
    - role
    - order
    - published

    primary: title

    sort:
    - order
    - title

    search:
    - title
    - role

    default:
      sort: order
      order: asc

  fields:
  - name: title
    label: Title
    type: string
    required: true

  - name: order
    label: Position/order
    type: number
    required: true

  - name: role
    label: Type
    type: string
    default: Videoset

  - name: published
    label: Published
    type: boolean
    default: true

  - name: youtube_embed_url
    label: YouTube embed URL
    type: string
    required: true
    description: 'Example: https://www.youtube.com/embed/VIDEO_ID'

  - name: description_en
    label: Description
    type: rich-text
    required: true
    options:
      format: markdown
      media: false


# =========================================================
# RENTAL
# =========================================================

- name: rental_items
  label: Rental
  type: collection
  path: _rental_items
  filename: '{primary}.md'

  view:
    fields:
    - title
    - quantity
    - category
    - order
    - published

    primary: title

    sort:
    - category
    - order
    - title

    search:
    - title
    - category

    default:
      sort: order
      order: asc

  fields:
  - name: title
    label: Product name
    type: string
    required: true

  - name: quantity
    label: Quantity
    type: number
    required: true
    default: 1

  - name: category
    label: Category
    type: select
    required: true
    options:
      values:
      - name: dj_audio
        label: DJ Equipment

      - name: lights
        label: Lighting

      - name: pa
        label: PA / Speakers

      - name: amplification
        label: Amplifiers / Processing

      - name: control
        label: Control / Data

      - name: accessories
        label: Accessories

      - name: photo_video
        label: FOTO / VIDEO

  - name: order
    label: Position/order
    type: number
    required: true

  - name: image
    label: Product photo
    type: image
    description: Optional. Photo can be added later.
    options:
      media: images
      path: rental
      rename: safe

  - name: description_en
    label: Description
    type: text

  - name: published
    label: Published
    type: boolean
    default: true


# =========================================================
# LEGAL PAGES
# =========================================================

- name: legal
  label: Legal / Privacy
  type: group

  items:

  - name: privacy_page
    label: Privacy Policy
    type: file
    path: privacy.md

    operations:
      delete: false

    fields:
    - name: layout
      type: string
      hidden: true

    - name: permalink
      type: string
      hidden: true

    - name: title_en
      label: Title
      type: string
      required: true

    - name: last_updated
      label: Last updated
      type: string
      description: 'Example: 17. 9. 2026'
      required: true

    - name: description
      label: SEO description
      type: text

    - name: content_en
      label: Text
      type: rich-text
      required: true
      options:
        format: markdown
        media: false


  - name: terms_page
    label: Terms & Conditions
    type: file
    path: terms.md

    operations:
      delete: false

    fields:
    - name: layout
      type: string
      hidden: true

    - name: permalink
      type: string
      hidden: true

    - name: title_en
      label: Title
      type: string
      required: true

    - name: last_updated
      label: Last updated
      type: string
      description: 'Example: 17. 9. 2026'
      required: true

    - name: description
      label: SEO description
      type: text

    - name: content_en
      label: Text
      type: rich-text
      required: true
      options:
        format: markdown
        media: false


# =========================================================
# SITE SETTINGS
# =========================================================

- name: site_settings
  label: Site settings
  type: file
  path: _data/site.yml

  operations:
    delete: false

  fields:

  - name: brand
    label: Brand
    type: string
    readonly: true

  - name: legal_operator_name
    label: Legal operator / person or company
    type: string
    description: Required for Privacy Policy. Use the actual person or company operating YAMAN SOUND.

  - name: legal_ico
    label: Company ID / IČO
    type: string
    description: Optional if you do not have a company ID / IČO.

  - name: legal_address
    label: Legal address / registered office
    type: string
    description: Address of the operator / data controller.

  - name: legal_email
    label: Legal / privacy contact email
    type: string


  # =====================================================
  # HOMEPAGE / PAGE TEXTS
  # =====================================================

  - name: home_intro_en
    label: Homepage intro
    type: text

  - name: events_intro_en
    label: Events intro
    type: text

  - name: sound_intro_en
    label: Sound intro
    type: text

  - name: description_en
    label: Footer description
    type: text


  # =====================================================
  # SOCIALS
  # =====================================================

  - name: instagram_events
    label: Instagram Events
    type: string

  - name: instagram_recordings
    label: Instagram Recordings
    type: string

  - name: facebook
    label: Facebook
    type: string

  - name: soundcloud
    label: SoundCloud
    type: string

  - name: youtube
    label: YouTube
    type: string


  # =====================================================
  # RENTAL
  # =====================================================

  - name: rental_intro_en
    label: Rental intro
    type: text

  - name: rental_contact_email
    label: Rental contact email
    type: string


  # =====================================================
  # NEWSLETTER
  # =====================================================

  - name: newsletter_image
    label: Newsletter poster
    type: image
    options:
      media: images
      path: newsletter
      rename: safe

  - name: newsletter_headline
    label: Newsletter headline
    type: string

  - name: newsletter_text_en
    label: Newsletter text
    type: text

  - name: newsletter_form_action
    label: Brevo form action URL
    type: string
    description: Public sibforms.com/serve/... action URL from the embedded Brevo signup form.