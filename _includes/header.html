<header class="site-header">
  <a class="logo" href="{{ '/index.html' | relative_url }}"><img src="{{ '/assets/img/yaman-recordings-logo.webp' | relative_url }}?v=20" alt="YAMAN Sound logo"></a>
  <div class="nav-wrap">
    <input class="nav-toggle" type="checkbox" id="nav-toggle" aria-hidden="true">
    <label class="nav-toggle-label" for="nav-toggle" aria-label="Open menu">Menu</label>
    <nav class="nav" aria-label="Main menu">
      <a href="{{ '/index.html' | relative_url }}"{% if page.nav == 'home' %} class="active"{% endif %}>Home</a>
      <a href="{{ '/events.html' | relative_url }}"{% if page.nav == 'events' %} class="active"{% endif %}>Events</a>
      <a href="{{ '/crew.html' | relative_url }}"{% if page.nav == 'crew' %} class="active"{% endif %}>Crew</a>
      <a href="{{ '/sound.html' | relative_url }}"{% if page.nav == 'sound' %} class="active"{% endif %}>Sound</a>
      <a href="{{ '/media.html' | relative_url }}"{% if page.nav == 'media' %} class="active"{% endif %}>Media</a>
      <a href="{{ '/contact.html' | relative_url }}"{% if page.nav == 'contact' %} class="active"{% endif %}>Contact</a>
    </nav>
    <div class="lang-toggle" aria-label="Language switch">
      <button type="button" data-lang-button="cs">CZ</button>
      <button type="button" data-lang-button="en">EN</button>
    </div>
    <div class="top-socials" aria-label="Social links">
      <a href="{{ site.data.site.instagram_events }}" target="_blank" rel="noopener" aria-label="Instagram"><img src="{{ '/assets/icons/instagram.webp' | relative_url }}" alt="Instagram"></a>
      <a href="{{ site.data.site.soundcloud }}" target="_blank" rel="noopener" aria-label="SoundCloud"><img src="{{ '/assets/icons/soundcloud.webp' | relative_url }}" alt="SoundCloud"></a>
      <a href="{{ site.data.site.youtube }}" target="_blank" rel="noopener" aria-label="YouTube"><img src="{{ '/assets/icons/youtube.webp' | relative_url }}" alt="YouTube"></a>
    </div>
  </div>
</header>
