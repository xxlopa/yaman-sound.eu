home_intro_cs: Pražský underground movement pro neurofunk, dark DnB, events, crew a YAMAN Recordings.
home_intro_en: Prague underground movement for neurofunk, dark DnB, events, crew and YAMAN Recordings.
events_intro_cs: Z pulsu pražského undergroundu vznikly Yaman Events — noci postavené na těžkém bassu, futuristické atmosféře a nekompromisní energii. Movement zaměřený na cutting-edge eventy v Česku se posouvá do další kapitoly.
events_intro_en: Born from the underground pulse of Prague, Yaman Events has been shaping nights driven by heavy bass, futuristic atmospheres and uncompromising energy.
sound_intro_cs: 'Yaman Recordings je forward-thinking Drum & Bass label propojující cutting-edge producenty, DJs a vizuální stránku moderní underground rave kultury. Stojí na těžkém sound designu, nekompromisní energii a silné identitě mezi neurofunkem, crossbreedem, industriálními texturami a futuristickou bass music.


  Yaman spojuje umělce, kteří staví na inovaci, technické přesnosti a syrovém dancefloor impactu — platforma, kde se hudba, vizuály a rave culture potkávají.'
sound_intro_en: 'Yaman Recordings is a forward-thinking Drum & Bass label focused on connecting cutting-edge producers, DJs and the visual side of modern underground rave culture. Built around heavy sound design, uncompromising energy and a strong artistic identity, the label moves between neurofunk, crossbreed, industrial textures and futuristic bass music while pushing a distinct audiovisual vision.


  Driven by precision production, dark atmospheres and underground mentality, Yaman brings together artists who value innovation, technical skill and raw dancefloor impact — creating a platform where music, visuals and rave culture collide.'
